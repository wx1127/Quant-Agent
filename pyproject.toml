[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-agent"
version = "0.9.0"
description = "A controlled quantitative research and trading-assistance agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [
  { name = "Quant Agent Contributors" }
]
dependencies = [
  "alembic>=1.14,<2",
  "duckdb>=1.2,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pyarrow>=18,<24",
  "psycopg[binary]>=3.3,<4",
  "sqlalchemy>=2.0,<3",
  "starlette>=0.46,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[tool.setuptools]
package-dir = { "" = "packages" }

[tool.setuptools.packages.find]
where = ["packages"]
include = ["quant_agent*"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=quant_agent",
  "--cov=apps",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=90",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["quant_agent", "apps"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "RUF001"]
"apps/api/**/*.py" = ["B008"]
"packages/quant_agent/reports/daily.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["quant_agent", "apps"]
mypy_path = ["packages", "."]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
