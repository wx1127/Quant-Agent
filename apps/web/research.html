<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quant Agent · 市场研究</title>
  <link rel="stylesheet" href="/web/static/app.css?v=20260801">
</head>
<body data-page="research">
  <div class="shell">
    <aside>
      <div class="brand-lockup"><span class="brand-mark">Q</span><div><p class="brand">QUANT AGENT</p><small>Research Console</small></div></div>
      <nav aria-label="主导航">
        <a class="active" href="/web/research"><span>◫</span> 市场研究</a>
        <a href="/web/trading"><span>◇</span> 组合与审批</a>
        <a href="/web/chat"><span>◎</span> 研究对话</a>
      </nav>
      <div class="sidebar-note"><span class="live-dot"></span> 只读研究模式<p>评分用于相对排序，不代表收益概率。</p></div>
    </aside>
    <main>
      <header class="topbar hero-bar">
        <div>
          <button id="back-button" class="ghost-button back-button" type="button">← 返回上一页</button>
          <p class="eyebrow">Market intelligence</p>
          <h1>市场研究</h1>
          <p id="as-of" class="muted">数据截止：等待认证后加载</p>
        </div>
        <div class="token-box compact-auth">
          <input id="api-token" type="password" autocomplete="off" placeholder="本次会话访问令牌" aria-label="访问令牌">
          <button id="save-token">连接数据</button>
        </div>
      </header>
      <p id="status" class="status-line" aria-live="polite"></p>
      <section class="grid research-grid">
        <article class="card regime-card span-4">
          <div class="section-head"><span class="pill">当前市场阶段</span><span id="regime-score" class="score-badge">—</span></div>
          <p id="regime-state" class="score">—</p>
          <p class="muted">阶段分类，不是上涨概率</p>
          <div class="regime-meter"><span id="regime-meter-fill"></span></div>
        </article>
        <article class="card span-8">
          <div class="section-head"><div><p class="eyebrow">Evidence</p><h2>阶段证据</h2></div><small>正反证据同时保留</small></div>
          <div id="regime-evidence"></div>
        </article>
        <article class="card span-12">
          <div class="section-head"><div><p class="eyebrow">Leading industries</p><h2>主线行业</h2></div><small>点击行业查看全部成分股评分 →</small></div>
          <div id="themes-grid" class="theme-grid"><p class="muted">认证后加载行业主线。</p></div>
        </article>
        <article class="card span-12">
          <div class="section-head"><div><p class="eyebrow">Stock selection</p><h2>龙头与候选个股</h2></div><span class="pill neutral-pill">仅展示股票</span></div>
          <div class="table-wrap"><table class="data-table">
            <thead><tr><th>个股</th><th>所属行业</th><th>角色</th><th>层级</th><th>综合分</th><th>状态</th></tr></thead>
            <tbody id="candidates-body"></tbody>
          </table></div>
        </article>
      </section>
    </main>
  </div>
  <script src="/web/static/app.js?v=20260801"></script>
</body>
</html>
