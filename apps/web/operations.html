<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quant-Agent 操作台</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div><span class="eyebrow">QUANT-AGENT / CONTROLLED OPERATIONS</span><h1>回测与审批操作台</h1></div><a href="index.html">返回研究台</a></header><main><section class="grid columns"><article><h2>创建回测</h2><form id="backtestForm"><input name="strategy_id" placeholder="策略 ID" value="s1" required><input name="strategy_version" placeholder="策略版本" value="v1" required><input name="start" type="date" value="2024-01-01" required><input name="end" type="date" value="2024-02-01" required><input name="initial_capital" type="number" value="100000" min="1" required><button>提交回测</button></form><pre id="backtestResult">—</pre></article><article><h2>订单审批</h2><form id="approvalForm"><input name="draft_id" placeholder="草案 ID" required><input name="idempotency_key" minlength="8" placeholder="幂等键" required><button>审批草案</button></form><pre id="approvalResult">—</pre><form id="paperForm"><input name="draft_id" placeholder="草案 ID" required><input name="approval_token" placeholder="审批令牌" required><button>Paper 提交</button></form><pre id="paperResult">—</pre></article></section><section class="status">所有操作受 API 认证、角色、风控和审批令牌约束；组合提案不会直接执行。</section></main><script type="module" src="operations.js"></script></body></html>
